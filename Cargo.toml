[package]
name = "game-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-server"
path = "src/bin/server.rs"
required-features = ["transport"]

[[bin]]
name = "netem-client"
path = "src/bin/netem-client.rs"
required-features = ["transport"]

[[bin]]
name = "control-client"
path = "src/bin/control-client.rs"
required-features = ["transport"]

[features]
default = ["transport"]
# The native host: WebTransport serving, match hosting, replay and recovery.
# Without it the crate is the client wire layer (frame codecs, snapshot
# reassembly, browser routes, control frames) and builds for wasm32-unknown-unknown.
transport = ["dep:ring", "dep:tokio", "dep:wtransport"]

[dependencies]
ring = { version = "0.17.14", optional = true }
tokio = { version = "1.53.1", optional = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
wtransport = { version = "0.7.2", optional = true, default-features = false, features = ["quinn", "ring"] }

[dev-dependencies]
# Self-signed identities let tests run real WebTransport sessions on loopback.
wtransport = { version = "=0.7.2", default-features = false, features = ["quinn", "ring", "self-signed"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
