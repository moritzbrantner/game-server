[package]
name = "game-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-server"
path = "src/bin/server.rs"

[dependencies]
ring = "0.17.14"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring"] }

[dev-dependencies]
# Self-signed identities let tests run real WebTransport sessions on loopback.
wtransport = { version = "=0.7.2", default-features = false, features = ["quinn", "ring", "self-signed"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
