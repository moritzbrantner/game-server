[package]
name = "game-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-server"
path = "src/bin/server.rs"

[features]
default = []
physics = ["dep:physics-engine"]

[dependencies]
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine.git", rev = "8ea513395ad6893e45da7d6fa983b6cd3949a4ac", optional = true }
ring = "0.17.14"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
