name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release --all-features
      - name: Build WebTransport probes
        run: cargo build --locked --bin game-server --bin netem-client --bin control-client
      - name: Run WebTransport packet impairment experiment
        run: sudo bash netem/webtransport-experiment.sh
      - name: Run reliable control experiment
        run: bash control/reliable-control-experiment.sh
      - name: Run multi-match host dispatch experiment
        run: bash hosting/match-dispatch-experiment.sh
      - name: Run graceful restart recovery experiment
        run: bash recovery/restart-experiment.sh
      - name: Run hosted graceful restart recovery experiment
        id: hosted-restart
        run: |
          set -o pipefail
          bash recovery/hosted-restart-experiment.sh 2>&1 | tee hosted-restart.log
      - name: Upload hosted recovery failure diagnostics
        if: failure() && steps.hosted-restart.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-restart-failure
          path: hosted-restart.log
          if-no-files-found: error
