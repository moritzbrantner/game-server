name: Materialize agent conventions (one-shot)

on:
  push:
    branches:
      - agent/adopt-coding-tooling

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Resolve current shared conventions and materialize managed cache
        run: |
          git clone --depth 1 https://github.com/moritzbrantner/coding-tooling.git ../coding-tooling
          git clone --depth 1 https://github.com/moritzbrantner/coding-agent-conventions.git ../coding-agent-conventions
          bun ../coding-tooling/src/cli.ts conventions update --json
          bun ../coding-tooling/src/cli.ts conventions check --json
          bun ../coding-tooling/src/cli.ts conventions diff --json
      - name: Commit verified installed convention files and retire one-shot workflow
        run: |
          git config user.name 'coding-tooling-install[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/agent-convention-install-once.yml
          git add -- conventions.lock.json .conventions
          git diff --cached --stat
          git commit -m 'Materialize current selected convention modules'
          git push origin "HEAD:${GITHUB_REF_NAME}"
